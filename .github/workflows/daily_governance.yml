name: Conseil d'Administration Life OS (Cloud 24/7)

on:
  schedule:
    # Se déclenche automatiquement chaque nuit à 05h00 du matin (PC éteint)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet de le déclencher manuellement d'un clic pour tester

permissions:
  contents: write

jobs:
  run-council:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le coffre Obsidian
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests

      - name: Délibération du Conseil d'Administration (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orchestrator.py

      - name: Enregistrer la décision dans le coffre Git
        run: |
          git config user.name "LifeOS Cloud Bot"
          git config user.email "lifeos-bot@users.noreply.github.com"
          git add 04_Executive_Decisions/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(governance): arbitrage nocturne du Conseil [skip ci]" && git push)
